# The dashboard commits to a light surface deliberately. The chart colours
# were validated against this exact background for colour vision deficiency
# separation and contrast, and letting the theme flip to dark would invalidate
# that without anything noticing.

[theme]
base = "light"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"

[server]
headless = true

[browser]
gatherUsageStats = false
