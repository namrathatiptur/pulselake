version: 2

models:
  - name: stg_vehicle_positions
    description: >
      Train positions with keys, derived timings, and feed quality flags.
      One row per train per snapshot.

    columns:
      - name: snapshot_train_key
        description: >
          fetch_id and entity_id. The unique key within a snapshot. This is
          the grain assertion for the whole ingestion path: if it ever fails,
          the loader has written the same snapshot twice.
        data_tests:
          - unique
          - not_null

      - name: trip_key
        description: >
          trip_id and start_date. The key for following a train across
          snapshots. Deliberately NOT unique here, because one train appears
          once per snapshot and that is the point of the table.
        data_tests:
          - not_null

      - name: fetch_id
        data_tests:
          - not_null
          - relationships:
              to: source('pulselake_raw', 'raw_feed_fetches')
              field: fetch_id

      - name: route_id
        description: Subway line. Never null in practice on the numbered feed.
        data_tests:
          - not_null

      - name: current_status
        description: Decoded GTFS VehicleStopStatus.
        data_tests:
          - not_null
          - accepted_values:
              # If MTA ever adds a fourth status this fails loudly, which is
              # better than the dashboard silently showing a blank label.
              values: ["STOPPED_AT", "IN_TRANSIT_TO", "INCOMING_AT"]

      - name: direction
        description: >
          N or S, decoded from the trip_id. Null for the small share of trips
          whose ids do not follow the NYCT convention, which is why this is a
          warning and not an error.
        data_tests:
          - accepted_values:
              values: ["N", "S"]
              config:
                severity: warn

      - name: trip_id
        description: >
          NOT unique within a snapshot. NYCT assigns the same trip_id to two
          physically different trains in roughly one percent of rows.
        data_tests:
          # This test is EXPECTED to warn. It is here as an executable record
          # of a known upstream defect: if it ever stops warning, MTA fixed
          # something and the models that work around it can be simplified.
          # Setting it to error would mean a red build every single run, which
          # is how teams learn to ignore their tests.
          - unique:
              config:
                severity: warn
                where: "snapshot_recency_rank = 1"

      - name: position_age_seconds
        description: >
          How stale a train's own position report was when MTA published the
          snapshot.

  - name: stg_trip_stop_updates
    description: >
      Predicted arrivals, one row per upcoming stop per trip per snapshot.
      Rows with no predicted arrival time are dropped.

    columns:
      - name: snapshot_stop_key
        description: fetch_id, entity_id and stop_index. Unique within a snapshot.
        data_tests:
          - unique
          - not_null

      - name: arrival_time
        description: Never null, enforced by the filter in the model.
        data_tests:
          - not_null

      - name: stop_id
        data_tests:
          - not_null

      - name: schedule_relationship
        data_tests:
          - accepted_values:
              values: ["SCHEDULED", "SKIPPED", "NO_DATA", "UNSCHEDULED"]

  - name: stg_alerts
    description: >
      Service alerts, one row per affected trip per snapshot. The only place
      MTA states directly that a train is delayed.

    columns:
      - name: fetch_id
        data_tests:
          - not_null
      - name: is_delay_alert
        data_tests:
          - not_null
