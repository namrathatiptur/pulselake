[pytest]
# Run pytest from the project root. rootdir is added to sys.path by the
# rootdir/conftest.py discovery, which is what lets tests import `ingest`
# without the package being installed.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q keeps the output readable; --strict-markers turns a typo in a marker
# name into an error rather than a silently ignored test.
addopts = -q --strict-markers --tb=short

filterwarnings =
    ignore::DeprecationWarning:google.*
